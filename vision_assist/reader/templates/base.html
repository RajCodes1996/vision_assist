<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Vision Assist{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #07111f;
            --surface-color: #111c31;
            --text-primary: #f8fafc;
            --text-secondary: #b1bfd4;
            --accent: #5ea0ff;
            --accent-hover: #4385e6;
            --accent-glow: rgba(94, 160, 255, 0.34);
            --border: rgba(148, 163, 184, 0.18);
        }
        
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            background-image:
                radial-gradient(circle at top left, rgba(94, 160, 255, 0.12), transparent 32%),
                radial-gradient(circle at top right, rgba(124, 58, 237, 0.08), transparent 28%),
                linear-gradient(180deg, #07111f 0%, #091728 100%);
            padding: 24px;
        }

        .container {
            width: 100%;
            max-width: 1180px;
            background: rgba(17, 28, 49, 0.76);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: clamp(20px, 3vw, 40px);
            box-shadow: 0 30px 70px -24px rgba(0, 0, 0, 0.6);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
        }
        
        .container:hover {
            transform: translateY(-5px);
            box-shadow: 0 25px 50px -12px var(--accent-glow);
        }

        header {
            text-align: center;
            margin-bottom: 30px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 800;
            margin-bottom: 10px;
            background: linear-gradient(to right, #8dc1ff, #98a9ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        
        p.subtitle {
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .form-group {
            margin-bottom: 24px;
        }
        
        .upload-area {
            border: 2px dashed var(--border);
            border-radius: 12px;
            padding: 40px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: rgba(15, 23, 42, 0.4);
            display: block;
        }
        
        .upload-area:hover, .upload-area.dragover {
            border-color: var(--accent);
            background: rgba(59, 130, 246, 0.05);
        }
        
        .upload-area:focus {
            outline: 2px solid var(--accent);
            outline-offset: 2px;
        }
        
        .upload-icon {
            font-size: 3rem;
            margin-bottom: 15px;
            color: var(--accent);
        }

        input[type="file"] {
            display: none;
        }

        .btn {
            display: inline-block;
            width: 100%;
            padding: 14px 24px;
            font-size: 1.2rem;
            font-weight: 600;
            color: white;
            background-color: var(--accent);
            border: none;
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-align: center;
            text-decoration: none;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        .btn:hover {
            background-color: var(--accent-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05), 0 0 15px var(--accent-glow);
        }

        .btn:focus {
            outline: 2px solid white;
            outline-offset: 2px;
        }

        .result-box {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--border);
            border-radius: 12px;
            padding: 30px;
            margin-bottom: 24px;
            min-height: 150px;
            max-height: 50vh;
            overflow-y: auto;
            font-size: 1.15rem;
            line-height: 1.8;
            color: var(--text-primary);
            overflow-wrap: break-word;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
        }

        .result-box p {
            margin-bottom: 1.25rem;
            letter-spacing: 0.03em;
        }

        .result-box p:last-child {
            margin-bottom: 0;
        }
        
        /* Custom scrollbar for result box */
        .result-box::-webkit-scrollbar {
            width: 8px;
        }
        .result-box::-webkit-scrollbar-track {
            background: rgba(15, 23, 42, 0.4);
            border-radius: 4px;
            margin: 4px;
        }
        .result-box::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 4px;
        }
        .result-box::-webkit-scrollbar-thumb:hover {
            background: var(--text-secondary);
        }

        .file-name {
            margin-top: 10px;
            font-size: 0.9rem;
            color: var(--accent);
            word-break: break-all;
            font-weight: 500;
        }
        
        /* Loading Spinner */
        .loader {
            border: 4px solid rgba(255, 255, 255, 0.1);
            border-radius: 50%;
            border-top: 4px solid white;
            width: 24px;
            height: 24px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 10px;
        }

        @-webkit-keyframes spin {
            0% { -webkit-transform: rotate(0deg); }
            100% { -webkit-transform: rotate(360deg); }
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>Vision Assist</h1>
            <p class="subtitle">AI Reader for the Visually Impaired</p>
        </header>
        
        {% block content %}
        {% endblock %}
    </div>
</body>
</html>
